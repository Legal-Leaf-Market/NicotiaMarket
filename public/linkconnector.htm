<!-- Site-ownership verification for the LinkConnector affiliate network,

     the DNS registry.

     KEEP THE EXTENSION .htm — not .html. LinkConnector checks the exact
     URL https://nicotiamarket.com/linkconnector.htm, and vercel.json
     sets cleanUrls:true, which strips .html and 308-redirects the
     bare-extension form. .htm is outside that rule, so this file serves
     directly at the URL they will fetch. Renaming it to .html would
     turn their check into a redirect.

     Deliberately plain: no stylesheet, no fonts, no engine. A verifier
     that does not run JavaScript must still see the string in the raw
     HTML, and there is nothing here that can fail to load.

     Safe to delete once the network confirms the account. -->
